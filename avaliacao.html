<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Página de confirmação do envio da avaliação de produto."
  >
  <meta name="author" content="Lucas da Luz Morais">

  <title>Avaliação Enviada</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="estilos/formulario.css">

  <script src="scripts/avaliacao.js" defer></script>
</head>

<body>
  <header class="page-header">
    <h1>Avaliação Enviada</h1>

    <p>
      Obrigado por compartilhar sua experiência.
    </p>
  </header>

  <main class="confirmation-main">
    <section class="confirmation-card">
      <div class="confirmation-icon" aria-hidden="true">
        ✓
      </div>

      <h2>Obrigado pela sua avaliação!</h2>

      <p>
        Sua avaliação foi registrada com sucesso.
      </p>

      <div class="review-counter">
        <p>Quantidade de avaliações concluídas neste navegador:</p>

        <strong id="review-count">0</strong>
      </div>

      <a class="return-button" href="formulario.html">
        Fazer outra avaliação
      </a>
    </section>
  </main>

  <footer>
    <p>
      &copy; <span id="current-year"></span>
      🌸 Lucas da Luz Morais 🌸
    </p>

    <p>
      Última modificação:
      <span id="last-modified"></span>
    </p>
  </footer>
</body>
</html>
