<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Álbum responsivo com informações e imagens de templos de A Igreja de Jesus Cristo dos Santos dos Últimos Dias."
  >

  <meta
    name="author"
    content="Lucas da Luz Morais"
  >

  <title>Álbum do Templo</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="estilos/templos-filtrados.css"
  >

  <link
    rel="stylesheet"
    href="estilos/templos-filtrados-grande.css"
  >

  <script
    src="scripts/templos-filtrados.js"
    defer
  ></script>
</head>

<body>
  <header>
    <div class="header-content">
      <span class="site-title">Álbum do Templo</span>

      <button
        id="menu-button"
        class="menu-button"
        type="button"
        aria-label="Abrir menu de navegação"
        aria-controls="navigation"
        aria-expanded="false"
      >
        ☰
      </button>

      <nav
        id="navigation"
        aria-label="Navegação principal"
      >
        <a
          id="home"
          data-filter="home"
          href="#"
          aria-current="page"
        >
          Página Inicial
        </a>

        <a
          id="old"
          data-filter="old"
          href="#"
        >
          Antigo
        </a>

        <a
          id="new"
          data-filter="new"
          href="#"
        >
          Novo
        </a>

        <a
          id="large"
          data-filter="large"
          href="#"
        >
          Grande
        </a>

        <a
          id="small"
          data-filter="small"
          href="#"
        >
          Pequeno
        </a>
      </nav>
    </div>
  </header>

  <main>
    <h1 id="page-title">Templos</h1>

    <!-- Os cartões serão criados pelo JavaScript. -->
    <section
      id="temple-cards"
      class="temple-grid"
      aria-label="Galeria de templos"
      aria-live="polite"
    ></section>
  </main>

  <footer>
    <p>
      &copy;
      <span id="current-year"></span>
      | Lucas da Luz Morais | Brasil
    </p>

    <p id="last-modified"></p>
  </footer>
</body>
</html>
